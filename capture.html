<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      background: rgba(0, 0, 0, 0.1);
    }

    #selection {
      position: absolute;
      border: 1px solid #2196F3;
      background: rgba(33, 150, 243, 0.1);
      display: none;
      pointer-events: none;
    }

    #guide {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      pointer-events: none;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    #crosshair {
      position: fixed;
      pointer-events: none;
      display: none;
      z-index: 1000;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background-color: #2196F3;
      box-shadow: 0 0 3px rgba(0,0,0,0.5);
    }

    #crosshair::before {
      width: 1px;
      height: 21px;
      left: 10px;
      top: 0;
    }

    #crosshair::after {
      width: 21px;
      height: 1px;
      left: 0;
      top: 10px;
    }

    .size-info {
      position: absolute;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="selection"></div>
  <div id="crosshair"></div>
  <div id="guide">按住鼠标左键并拖动来选择截图区域<br>按 ESC 键取消</div>
  <div id="size-info" class="size-info" style="display: none;"></div>

  <script>
    const selection = document.getElementById('selection');
    const crosshair = document.getElementById('crosshair');
    const guide = document.getElementById('guide');
    const sizeInfo = document.getElementById('size-info');
    let startPos = null;

    // 更新十字光标位置
    document.addEventListener('mousemove', (e) => {
      crosshair.style.display = 'block';
      crosshair.style.left = (e.clientX - 10) + 'px';
      crosshair.style.top = (e.clientY - 10) + 'px';
    });

    document.addEventListener('mousedown', (e) => {
      startPos = { x: e.clientX, y: e.clientY };
      selection.style.display = 'block';
      selection.style.left = startPos.x + 'px';
      selection.style.top = startPos.y + 'px';
      guide.style.display = 'none';
      
      // 显示尺寸信息
      sizeInfo.style.display = 'block';
      updateSizeInfo(0, 0);
    });

    document.addEventListener('mousemove', (e) => {
      if (!startPos) return;

      const currentPos = { x: e.clientX, y: e.clientY };
      const width = Math.abs(currentPos.x - startPos.x);
      const height = Math.abs(currentPos.y - startPos.y);

      selection.style.left = Math.min(startPos.x, currentPos.x) + 'px';
      selection.style.top = Math.min(startPos.y, currentPos.y) + 'px';
      selection.style.width = width + 'px';
      selection.style.height = height + 'px';

      // 更新尺寸信息位置和内容
      updateSizeInfo(width, height);
    });

    document.addEventListener('mouseup', async (e) => {
      if (!startPos) return;

      const endPos = { x: e.clientX, y: e.clientY };
      const bounds = {
        x: Math.min(startPos.x, endPos.x),
        y: Math.min(startPos.y, endPos.y),
        width: Math.abs(endPos.x - startPos.x),
        height: Math.abs(endPos.y - startPos.y)
      };

      if (bounds.width < 5 || bounds.height < 5) {
        // 选择区域太小，重置
        resetSelection();
        return;
      }

      // 隐藏所有UI元素
      selection.style.display = 'none';
      crosshair.style.display = 'none';
      sizeInfo.style.display = 'none';
      
      // 调用截图
      try {
        await window.electron.invoke('capture-screen', bounds);
      } catch (error) {
        console.error('截图失败:', error);
      }
    });

    document.addEventListener('keydown', async (e) => {
      if (e.key === 'Escape') {
        resetSelection();
        await window.electron.invoke('cancel-capture-screen');
      }
    });

    function resetSelection() {
      startPos = null;
      selection.style.display = 'none';
      sizeInfo.style.display = 'none';
      guide.style.display = 'block';
    }

    function updateSizeInfo(width, height) {
      sizeInfo.textContent = `${width} × ${height}`;
      const selectionRect = selection.getBoundingClientRect();
      sizeInfo.style.left = (selectionRect.left + selectionRect.width / 2 - sizeInfo.offsetWidth / 2) + 'px';
      sizeInfo.style.top = (selectionRect.top - 25) + 'px';
    }
  </script>
</body>
</html>
